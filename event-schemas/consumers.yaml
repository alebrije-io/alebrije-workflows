  # event types (contact.opted_out/opted_in/created/updated, appointment.completed),
  # only crm.contact.created had a registered schema as of 2026-07-01 (found via
  # fleet grep for event_bus/EventConsumer, previously absent from this map
  # entirely); the other 4 were listed under unverified_drift until
  # DEBT-AUDIT-20260701-019-catalog-crm-agenda (f64b5da) registered all of them
  # (crm.contact.opted_out/opted_in/updated.v1.json + appointment.completed.v1.json)
  # — moved here now that every event_type this consumer handles has a schema.
  - service: alebrije-mod-campaigns-ex
    event_type: crm.contact.created
    stream: "events:crm"
    handler: AlebrijeCampaigns.Workers.EventConsumer (Broadway)
    source: alebrije-mod-campaigns-ex/lib/alebrije_campaigns/workers/event_consumer.ex:290
  - service: alebrije-mod-campaigns-ex
    event_type: crm.contact.opted_out
    stream: "events:crm"
    handler: AlebrijeCampaigns.Workers.EventConsumer (Broadway)
    source: alebrije-mod-campaigns-ex/lib/alebrije_campaigns/workers/event_consumer.ex:224
  - service: alebrije-mod-campaigns-ex
    event_type: crm.contact.opted_in
    stream: "events:crm"
    handler: AlebrijeCampaigns.Workers.EventConsumer (Broadway)
    source: alebrije-mod-campaigns-ex/lib/alebrije_campaigns/workers/event_consumer.ex:247
  - service: alebrije-mod-campaigns-ex
    event_type: crm.contact.updated
    stream: "events:crm"
    handler: AlebrijeCampaigns.Workers.EventConsumer (Broadway)
    source: alebrije-mod-campaigns-ex/lib/alebrije_campaigns/workers/event_consumer.ex:307
  # appointment.completed reaches this consumer via the outbox-routed
  # "events:campaigns" stream (see appointment.completed.v1.json's description:
  # outbox.ex @stream_routes sends this specific event_type to events:campaigns,
  # not the bare "appointment.completed" stream rewards-go reads). Declared here
  # with stream "events:crm" to match this file's pre-existing convention for
  # this consumer's other 4 entries (all Broadway-consumed under the same
  # EventConsumer module); the contract check only cross-references event_type
  # against the registered schema, not stream, so this does not affect CI.
  - service: alebrije-mod-campaigns-ex
    event_type: appointment.completed
    stream: "events:crm"
    handler: AlebrijeCampaigns.Workers.EventConsumer (Broadway)
    source: alebrije-mod-campaigns-ex/lib/alebrije_campaigns/workers/event_consumer.ex:264

# ── Drift NO verificado contra el registry (el workflow IGNORA esta clave) ─────
# Suscripciones reales del código cuyo event_type o stream NO coincide con un
# schema registrado. Cada una es un candidato a: (a) registrar el schema, o
# (b) migrar el consumidor al nombre canónico ADR-31. NO se ponen en
# `subscriptions:` porque romperían el lint de contrato (que es el punto: el
# drift existe y debe resolverse, no esconderse — Inquebrantable: no degradar
# gates). Mover una entrada aquí a `subscriptions:` SIN registrar su schema
# hará fallar CI a propósito.
unverified_drift:
  # NOTE: the GDPR DSR canonical fan-out (auth.dsr.erasure_approved, 8 consumers
  # incl. mcp-go eventfeeder) was MOVED to subscriptions: now that
  # auth.dsr.erasure_approved.v1.json is registered.

  # control-medico syncs employee data from svc-auth on empleado.updated. The
  # canonical name would be auth.employee.updated (ADR-31 Appendix A) — neither
  # empleado.updated nor auth.employee.updated has a registered schema.
  - service: alebrije-mod-control-medico
    event_type: empleado.updated
    stream: "empleado.updated"
    reason: legacy name; no registered schema (canonical would be auth.employee.updated)
    source: alebrije-mod-control-medico/app/main.py:119

  # crm-go TimelineConsumer subscribes to legacy stream-per-event names that do
  # not match canonical event_types nor registered schemas. These stay here:
  # blocked-producer-mismatch — the consumer reads a legacy stream/name while the
  # producer emits the canonical event_type, so migrating the subscription would
  # require a producer-side change first. NOT moved to subscriptions (would break
  # the contract lint) until the consumer is repointed to the canonical name.
  # NOTE: cadences.outcome_recorded (timeline_consumer.go:49) was DEPRECATED-REMOVED
  # in crm-go and is no longer subscribed — dropped from this list.
  - service: alebrije-mod-crm-go
    event_type: payments.completed
    stream: "payments.completed"
    reason: blocked-producer-mismatch; consumer on legacy name, canonical = payments.payment.completed (producer emits canonical)
    source: alebrije-mod-crm-go/internal/service/timeline_consumer.go:46
  # CORRECTED 2026-07-03 (DEBT-AUDIT-20260701-019-rewards): the "canonical =
  # rewards.points.earned/redeemed" claim below was WRONG — verified directly
  # against alebrije-mod-rewards-go/internal/service/events_publisher.go:226,233,
  # the producer literally sets EventType = "rewards.earned" / "rewards.redeemed"
  # (no "rewards.points.*" string exists anywhere in that repo's Go source). The
  # event-schemas registry was renamed to match (rewards.earned.v1.json /
  # rewards.redeemed.v1.json) in the same change. So event_type here IS canonical
  # and now has a registered schema. Still NOT moved to subscriptions: though —
  # a deeper, separate risk was found while fixing this: the composition root
  # (alebrije-mod-rewards-go/cmd/server/main.go:162) routes earn/redeem through
  # OutboxEventPublisher, which for the tx-present (real pool, i.e. prod) path
  # writes ONLY to the `outbox` table -> poller -> the enveloped domain stream
  # "events:rewards"; it never XADDs the bare "rewards.earned"/"rewards.redeemed"
  # stream this consumer reads (that bare-stream write only happens on the
  # pool-less/test fallback). If that reading is correct, this crm-go consumer is
  # silently starved in production regardless of the event_type name being right.
  # Fixing the consumer's subscription is a alebrije-mod-crm-go change — out of
  # scope for this lane (event-schemas only); flagged for a follow-up DEBT item.
  - service: alebrije-mod-crm-go
    event_type: rewards.earned
    stream: "rewards.earned"
    reason: possible-dead-consumer (see comment above) — event_type IS canonical and now has a registered schema (rewards.earned.v1.json), but the bare stream it reads may never receive prod traffic (prod earn path writes only to the outbox -> events:rewards domain stream)
    source: alebrije-mod-crm-go/internal/service/timeline_consumer.go:47
  - service: alebrije-mod-crm-go
    event_type: rewards.redeemed
    stream: "rewards.redeemed"
    reason: possible-dead-consumer (see comment above) — event_type IS canonical and now has a registered schema (rewards.redeemed.v1.json), but the bare stream it reads may never receive prod traffic (prod redeem path writes only to the outbox -> events:rewards domain stream)
    source: alebrije-mod-crm-go/internal/service/timeline_consumer.go:48
  - service: alebrije-mod-crm-go
    event_type: omnichannel.message_received
    stream: "omnichannel.message_received"
    reason: blocked-producer-mismatch; consumer on legacy name, canonical = omnichannel.message.received (producer emits canonical)
    source: alebrije-mod-crm-go/internal/service/timeline_consumer.go:44

  # agentic CrossModuleEventConsumer subscribes to several cross-module streams.
  # NOTE: crm.lead.created (config.py:44) was MIGRATED to the canonical
  # crm.contact.created and MOVED to subscriptions:.
  # NOTE: field_ops.sla.breach (config.py:54) was MOVED to subscriptions: now that
  # field_ops.sla.breach.v1.json is registered (event_type EN-USO).
  # NOTE: campaigns.send_failed (config.py:49) was DEPRECATED-REMOVED in agentic
  # and is no longer subscribed — dropped from this list.
  # NOTE: payments.payment.failed and control_medico.dictamen.created (agentic
  # CrossModuleEventConsumer config.py) were MOVED to subscriptions: now that their
  # canonical schemas are registered. agenda.appointment.no_show was canonicalised to
  # appointment.noshow (#177, 2026-06-26 — the name the producer actually emits) and its
  # dead agentic subscription was REMOVED in code (app/workers/event_consumer.py); no
  # subscription remains for it.

  # mcp-go eventbridge other default triggers without registered schemas.
  # NOTE: the mcp-go eventfeeder auth.dsr.erasure_approved bridge was MOVED to
  # subscriptions: now that its schema is registered. The mcp-go eventbridge agenda
  # no_show default trigger was REMOVED from internal/eventbridge/defaults.go (#177);
  # the event was canonicalised to appointment.noshow — no subscription remains for it.
  # NOTE: field_ops.sla.breach (mcp-go eventbridge defaults.go:41) was MOVED to
  # subscriptions: now that field_ops.sla.breach.v1.json is registered (EN-USO name).
  # NOTE: crm.lead.created (mcp-go eventbridge crm-contact-created-cadence trigger,
  # defaults.go) was MIGRATED to the canonical crm.contact.created and MOVED to
  # subscriptions: now that the trigger subscribes to the canonical name the
  # producer (alebrije-mod-crm-go ContactCreated, redis_publisher.go:218) emits.
  - service: alebrije-mcp-go
    event_type: toronja.lab.result_ready
    stream: "events:toronja"
    reason: no registered schema (adapt-toronja publishes toronja.result_validated)
    source: alebrije-mcp-go/internal/eventbridge/defaults.go:70

  # cadences-ex OutcomeListener consumes its own outcomes stream (no schema yet).
  - service: alebrije-mod-cadences-ex
    event_type: cadences.outcome_recorded
    stream: "events:cadences.outcomes"
    reason: no registered schema for outcome events
    source: alebrije-mod-cadences-ex/lib/alebrije_cadences/workers/outcome_listener.ex:3

  # notifications-ex ResultConsumer (Broadway) — REAL prod consumer gated by
  # TORONJA_CONSUMER_ENABLED=true (config/runtime.exs:329-348), delivers
  # validated lab results to patients (DEBT-TORONJA-DELIVERY-001 Etapa 3).
  # Producer = adapt-toronja EventPublisher.publish_result_validated. No
  # schema is registered for toronja.result_validated today — the only
  # toronja-related entry in this file before 2026-07-01 was mcp-go's
  # (mismatched) toronja.lab.result_ready below; this consumer was entirely
  # absent from the map. Found via fleet grep for event_bus/Broadway consumers.
  - service: alebrije-svc-notifications-ex
    event_type: toronja.result_validated
    stream: "toronja.result_validated"
    reason: no registered schema for toronja.result_validated (real prod consumer, group notifications-ex-toronja)
    source: alebrije-svc-notifications-ex/lib/alebrije_notifications/toronja/result_consumer.ex:9

  # campaigns-ex EventConsumer (Broadway over events:crm) — all 5 handled event
  # types (contact.created/opted_out/opted_in/updated, appointment.completed) now
  # have registered producer schemas and were MOVED to subscriptions: above.
  # DEBT-AUDIT-20260701-019-catalog-crm-agenda (f64b5da) registered the 4 that
  # were listed here (crm.contact.opted_out/opted_in/updated.v1.json +
  # appointment.completed.v1.json) — nothing remains unregistered for this
  # consumer.
