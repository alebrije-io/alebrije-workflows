  #   - mcp-go eventbridge dropped its default trigger (no agenda no_show EventPattern
  #     remains in internal/eventbridge/defaults.go).
  # No live consumer subscribes to appointment.noshow today, so there is no subscription
  # entry (same as agenda.appointment.booked / agenda.appointment.cancelled). The
  # producer's own comment (appointments.ex maybe_publish_status/3) names
  # rewards-go / crm-go / notifications-ex as the intended cross-module consumers; add a
  # subscription here when one actually wires up to the canonical name.

