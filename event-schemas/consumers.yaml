  # mcp-go eventbridge crm-contact-created-cadence trigger migrated from the legacy
  # crm.lead.created name to the canonical crm.contact.created event_type
  # (crm.contact.created.v1.json is registered). Producer = alebrije-mod-crm-go
  # ContactCreated (redis_publisher.go:218). Moved out of unverified_drift now that
