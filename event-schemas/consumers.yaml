  - service: alebrije-mcp-go
    event_type: crm.contact.created
    stream: "events:crm"
    handler: eventbridge (crm-contact-created-cadence trigger)
    source: alebrije-mcp-go/internal/eventbridge/defaults.go:25

  # campaigns-ex EventConsumer (Broadway over events:crm) — validates the
  # PREFIXED producer envelope BEFORE stripping the `crm.` namespace to route
