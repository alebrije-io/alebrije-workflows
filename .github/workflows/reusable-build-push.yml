name: Reusable Build & Push Docker Image

# Este workflow reusable centraliza toda la lógica de build, security scanning, y signing
# Implementa estándares Alebrije:
# - Docker Hub (ileonelperea/*)
# - Multi-arch: linux/amd64 (OVH prod) + linux/arm64 (M-series dev, futuro ARM cloud).
#   ADR-40 rollout: Dockerfiles Go usan BUILDPLATFORM para cross-compile,
#   Dockerfiles Elixir usan TARGETPLATFORM (BEAM release es per-arch).
# - SBOM + provenance (mode=max)
# - Cosign keyless signing via Sigstore OIDC
# - Trivy CRITICAL bloquea, HIGH reporta (SARIF)
# - Docker Scout CVE analysis
# - detect-secrets baseline audit
#
# Uso en repo individual:
#   - name: Build & Push
#     uses: ./alebrije-workflows/.github/workflows/02-reusable-build-push.yml@main
#     with:
#       image-name: "ileonelperea/alebrije-svc-auth"
#       context: "."
#       # platforms opcional — default linux/amd64,linux/arm64
#     secrets: inherit

on:
  workflow_call:
    inputs:
      image-name:
        description: "Docker image name (full path, e.g., ileonelperea/alebrije-svc-auth)"
        required: true
        type: string
      context:
        description: "Build context directory"
        required: false
        default: "."
        type: string
      dockerfile:
        description: "Path to Dockerfile relative to context"
        required: false
        default: "Dockerfile"
        type: string
      push:
        description: "Whether to push to registry (false for testing builds)"
        required: false
        default: true
        type: boolean
      platforms:
        description: "Comma-separated target platforms (buildx). Default is multi-arch."
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      push-mutable-latest:
        description: >-
          Whether to ALSO publish the mutable :latest tag alongside the
          immutable :VERSION tag. Default false (DEBT-§43 SC-11): a floating
          :latest silently defeats SHA/version-pinned deploys and lets a stale
          image be pulled by any consumer that resolves `:latest`. The whole
          fleet deploys by :VERSION / @digest (redeploy-prod.sh + deploy-repo.sh
          do `kubectl set image ...=<image>:<VERSION-file>`; consumer k8s
          manifests pin `:__VERSION__` / explicit semver — never `:latest`), so
          nothing depends on it. Leave false unless a specific consumer is later
          proven to require a floating tag, and document why.
        required: false
        default: false
        type: boolean
    outputs:
      image-tag:
        description: "Full image tag pushed (image-name:VERSION)"
        value: ${{ jobs.build-and-push.outputs.image-tag }}
      image-digest:
        description: "Docker image digest (sha256:...)"
        value: ${{ jobs.build-and-push.outputs.image-digest }}
      version:
        description: "Version from VERSION file"
        value: ${{ jobs.build-and-push.outputs.version }}

permissions:
  contents: read
  id-token: write        # required for Cosign keyless signing via Sigstore OIDC
  packages: write
  security-events: write # required for github/codeql-action/upload-sarif

jobs:
  build-and-push:
    name: Build & Push
    runs-on: arc-runner-set
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.tag }}

    steps:
      # ====================================================================
      # 1. CHECKOUT & SETUP
      # ====================================================================
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      # QEMU is required so buildx can emulate foreign archs during cross-build.
      # Go Dockerfiles cross-compile natively (BUILDPLATFORM trick) but Elixir
      # Dockerfiles pin to TARGETPLATFORM and need qemu when the runner is amd64.
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3  # v3.0.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@aa33708b10e362ff993539393ff100fa93ed6a27  # v3.5.0

      # ====================================================================
      # 1b. SUPPLY-CHAIN GATE: APPROVED BASE IMAGES (pre-build)
      # ====================================================================
      # Valida que cada FROM del Dockerfile que vamos a construir esté en la
      # whitelist canónica (approved-base-images.json de alebrije-workflows).
      # Corre ANTES del build para fallar barato si el Dockerfile introduce una
      # base no aprobada (DEBT-§43-SUPPLY-CHAIN-6: el gate existía como reusable
      # workflow huérfano con 0 callers — aquí queda cableado para los ~33
      # consumidores de build-push sin tocar 33 repos). El matcher ignora
      # scratch, stages multi-stage (FROM <stage>) y FROMs templatizados
      # (${BUILDER_IMAGE}, golang:${GO_VERSION}-alpine) — esos resuelven en
      # build y no se pueden validar estáticamente.
      - name: Fetch approved-base-images whitelist
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
        with:
          repository: alebrije-io/alebrije-workflows
          ref: main
          sparse-checkout: |
            approved-base-images.json
          sparse-checkout-cone-mode: false
          path: .alebrije-workflows-whitelist

      - name: Gate — validate Dockerfile base images against whitelist
        shell: python3 {0}
        env:
          DOCKERFILE: ${{ inputs.context }}/${{ inputs.dockerfile }}
          WHITELIST_FILE: .alebrije-workflows-whitelist/approved-base-images.json
        run: |
          import json
          import os
          import re
          import sys
          from pathlib import Path

          dockerfile = Path(os.environ["DOCKERFILE"])
          whitelist_file = Path(os.environ["WHITELIST_FILE"])

          if not dockerfile.is_file():
              print(f"::error::Dockerfile not found at {dockerfile} — cannot validate base images.")
              sys.exit(1)

          # Build a TAG-EXACT whitelist. The catalog enumerates approved
          # `name:tag` pairs precisely so the gate catches *tag* drift (the
          # whole point of DEBT-§43-SUPPLY-CHAIN-7). We deliberately do NOT add
          # the bare `name` to the allow-set: doing so would let ANY tag of an
          # approved registry name pass (e.g. golang:9.9-evil, python:2.7-eol),
          # silently defeating tag enforcement. A tagless `FROM <name>` is
          # normalized to `<name>:latest` below and must be explicitly listed.
          approved = json.load(whitelist_file.open())
          approved_images = set()
          for entry in approved.get("images", []):
              name = entry.get("name", "")
              tags = entry.get("approved_tags") or ([entry["tag"]] if entry.get("tag") else [])
              for tag in tags:
                  approved_images.add(f"{name}:{tag}")

          print(f"[approved-images] Whitelist: {len(approved_images)} approved name:tag entries")

          FROM_RE = re.compile(
              r'^FROM\s+(?:--platform=\S+\s+)?(\S+)(?:\s+(?:AS|as)\s+(\S+))?',
              re.IGNORECASE | re.MULTILINE,
          )

          content = dockerfile.read_text(errors="replace")
          stage_names = {m.group(2).lower() for m in FROM_RE.finditer(content) if m.group(2)}

          violations = []
          for match in FROM_RE.finditer(content):
              image = match.group(1)
              if image.lower() == "scratch":
                  continue
              if image.lower() in stage_names:
                  continue  # intra-Dockerfile multi-stage reference
              # Any build-arg substitution in the ref (registry name OR tag,
              # e.g. ${BUILDER_IMAGE}, golang:${GO_VERSION}-alpine) resolves at
              # build time — the literal tag isn't knowable statically, so we
              # cannot enforce it here. Skip only these; everything else must
              # match an exact name:tag pair.
              if "$" in image:
                  continue
              # Tagless FROM <name> implies :latest; require the exact pair to be
              # whitelisted (we don't approve floating :latest tags by default).
              check_image = image if ":" in image else f"{image}:latest"
              if check_image not in approved_images:
                  violations.append(f"  {dockerfile}: FROM {image}")

          if violations:
              print("::error::Non-approved base image(s) in Dockerfile — see alebrije-workflows/approved-base-images.json:")
              for v in violations:
                  print(v)
              sys.exit(1)
          print("[approved-images] All Dockerfile base images are approved ✓")

      # Autenticación a Vault via K8s auth (SA del runner pod)
      # Exporta DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, GH_TOKEN como env vars
      - name: Get CI secrets from Vault
        uses: hashicorp/vault-action@9c2d817b85b9fff56bcab21cb74b485aee9e9d73  # v2.8.1
        with:
          url: http://vault.vault.svc:8200
          method: kubernetes
          role: ci-runner-role
          secrets: |
            alebrije/data/ci/dockerhub username | DOCKERHUB_USERNAME ;
            alebrije/data/ci/dockerhub token | DOCKERHUB_TOKEN ;
            alebrije/data/ci/github gh_token | GH_TOKEN

      - name: Login to DockerHub
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446  # v3.2.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # ====================================================================
      # 2. READ VERSION FILE
      # ====================================================================
      # VERSION debe estar en el root del repo (e.g., "0.1.2")
      - name: Read version from VERSION file
        id: version
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found in repo root"
            exit 1
          fi
          TAG=$(cat VERSION | tr -d '[:space:]')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version to build: $TAG"

      # ====================================================================
      # 3. FREE DISK SPACE (required for large images like svc-ai with torch/ML deps)
      # ====================================================================
      # GitHub Actions ubuntu-latest runners have ~14GB usable. Large ML images
      # (torch + sentence-transformers + baked model weights) can exceed that.
      # Freeing pre-installed tools (~13GB) prevents "No space left on device".
      - name: Free disk space
        continue-on-error: true
        run: |
          echo "Disk before cleanup:"
          df -h /
          rm -rf /usr/share/dotnet
          rm -rf /usr/local/lib/android
          rm -rf /opt/ghc
          rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h /

      # ====================================================================
      # 4. DOCKER BUILD & PUSH (multi-arch)
      # ====================================================================
      # Aplica:
      # - platforms: linux/amd64,linux/arm64 (override via `platforms` input)
      # - sbom: true (genera SBOM durante build)
      # - provenance: mode=max (attestations para cadena de custodia)
      # - cache-from/cache-to: BuildKit registry cache (type=registry, compatible ARC)
      # - push: input configurable (test sin push)
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@5176d81f87c23d6fc96624dfdbcd9f3830bbe445  # v6.5.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          sbom: true
          provenance: mode=max
          platforms: ${{ inputs.platforms }}
          secrets: |
            "gh_token=${{ env.GH_TOKEN }}"
          # Immutable :VERSION tag always. The mutable :latest is opt-in only
          # (push-mutable-latest, default false — DEBT-§43 SC-11): publishing a
          # floating :latest undermines version/digest-pinned deploys. When the
          # input is false the expression resolves to the empty string and the
          # multi-line tags list contains only the :VERSION entry.
          tags: |
            ${{ inputs.image-name }}:${{ steps.version.outputs.tag }}
            ${{ inputs.push-mutable-latest && format('{0}:latest', inputs.image-name) || '' }}
          cache-from: type=registry,ref=${{ inputs.image-name }}:buildcache
          cache-to: type=registry,ref=${{ inputs.image-name }}:buildcache,mode=max

      # ====================================================================
      # 5. SECURITY: TRIVY VULNERABILITY SCANNING (optimizado: 2 scans vs 4)
      # ====================================================================
      # CRITICAL (table + JSON): bloquea el pipeline — ADR-29 §6.2 Gate 1.
      #   El scan corre con exit-code: 0 para NO confundir un fallo de infra de
      #   Trivy (timeout de registry, rate-limit de DB de vulns, etc.) con un CVE
      #   real. La salida JSON se inspecciona en un step dedicado que SOLO falla
      #   cuando existe un CRITICAL con fix disponible (ignore-unfixed: true). Así
      #   el gate sigue siendo bloqueante para CVEs reales sin bloquear por ruido
      #   de infra — en lugar de `continue-on-error: true` que tragaba ambos.
      # CRITICAL+HIGH (SARIF): reporte unificado en GitHub Security tab — no bloquea
      # SBOM: eliminado aquí — 'sbom: true' en el build step ya genera SBOM como
      #   OCI attestation en DockerHub. Trivy CycloneDX era duplicado (+10-40min).
      - name: Trivy scan — CRITICAL (table, display)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        continue-on-error: true  # solo display; el gate real es el step JSON + gate
        with:
          image-ref: ${{ inputs.image-name }}:${{ steps.version.outputs.tag }}
          format: table
          severity: CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Trivy scan — CRITICAL (JSON, for gate)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        continue-on-error: true  # fallo de infra de Trivy no debe enmascararse como CVE; lo evalúa el gate
        with:
          image-ref: ${{ inputs.image-name }}:${{ steps.version.outputs.tag }}
          format: json
          output: trivy-critical.json
          severity: CRITICAL
          exit-code: 0
          ignore-unfixed: true

      # Gate 1 bloqueante (ADR-29 §6.2): falla si hay ≥1 CRITICAL con fix.
      # Distingue infra-error de CVE-found: si el JSON no existe → fallo de infra
      # del step anterior → error explícito (no silenciamos). Si existe pero tiene
      # CRITICALs fixables → exit 1. Si existe sin CRITICALs → pasa.
      - name: Gate 1 — fail on CRITICAL vulnerabilities (ADR-29 §6.2)
        run: |
          if [ ! -f trivy-critical.json ]; then
            echo "::error::Trivy CRITICAL scan no produjo trivy-critical.json — fallo de infra del scan, no se puede verificar el gate. Revisar logs del step anterior."
            exit 1
          fi
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-critical.json)
          if [ -z "$COUNT" ]; then
            echo "::error::No se pudo parsear trivy-critical.json — el scan no entregó un reporte válido."
            exit 1
          fi
          echo "CRITICAL (con fix disponible) encontrados: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Gate 1 bloqueado — la imagen tiene $COUNT CVE(s) CRITICAL con fix disponible. Resolver antes de publicar (ADR-29 §6.2 Gate 1)."
            JQ_LIST='.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")'
            JQ_FMT='"  - \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) → \(.FixedVersion)"'
            jq -r "$JQ_LIST | $JQ_FMT" trivy-critical.json
            exit 1
          fi
          echo "Gate 1 OK — sin CVEs CRITICAL fixables en la imagen."

      - name: Trivy scan — CRITICAL+HIGH (SARIF, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ steps.version.outputs.tag }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

      # ====================================================================
      # 6. UPLOAD REPORTS (SARIF)
      # ====================================================================
      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@eb055d739abdc2e8de2e5f4ba1a8b246daa779aa  # v3.26.0
        continue-on-error: true  # Private repos sin GHAS no fallan
        with:
          sarif_file: trivy.sarif
          category: Trivy

      # ====================================================================
      # 7. SECURITY: DOCKER SCOUT ANALYSIS
      # ====================================================================
      # Análisis de CVEs y recommendations desde Docker Scout
      # Non-blocking por defecto (informational)
      - name: Docker Scout analysis
        if: inputs.push == true
        uses: docker/scout-action@fc749439af4870e8f6feb592250ab728600d10a6  # v1.10.0
        with:
          command: cves,recommendations
          image: ${{ inputs.image-name }}:${{ steps.version.outputs.tag }}
          sarif-file: scout-results.sarif
          summary: true
        continue-on-error: true

      # ====================================================================
      # 8. SECURITY: DETECT-SECRETS BASELINE AUDIT
      # ====================================================================
      # Escanea cambios en repo para credenciales/tokens hardcodeados
      - name: Set up Python for security tools
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
        with:
          python-version: '3.12'

      - name: Install and run detect-secrets
        # Fixed 2026-07-29: BOTH lines below were decorative. `scan --baseline FILE`
        # always exits 0 and silently absorbs new secrets into the baseline
        # (detect_secrets/main.py's handle_scan_action merges+saves unconditionally).
        # `audit --report` is equally non-blocking — main() always `return 0`
        # regardless of action. Neither ever failed a build. Diff a throwaway scan
        # against the committed baseline instead; never call --baseline here.
        # Canary + full rationale: alebrije-adapt-toronja/run_prepush.sh. This step
        # runs against the CALLING repo's checkout (see the checkout step above), so
        # it gates every repo that consumes this reusable workflow.
        run: |
          pip install detect-secrets --quiet
          detect-secrets scan --exclude-files ".secrets.baseline" > /tmp/secrets_check_ci.json
          # detect-secrets results minus the per-entry is_secret verdicts, sorted so two
          # scans of the same tree compare byte-for-byte.
          normalize_results() {
            python3 - "$1" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          r = d.get('results', {})
          print(json.dumps({f: [{k: v for k, v in e.items() if k != 'is_secret'} for e in es]
                            for f, es in r.items()}, sort_keys=True))
          PY
          }
          OLD_RESULTS=$(normalize_results .secrets.baseline) || { echo "::error::detect-secrets: no pude leer/parsear .secrets.baseline" >&2; exit 1; }
          NEW_RESULTS=$(normalize_results /tmp/secrets_check_ci.json) || { echo "::error::detect-secrets: no pude leer/parsear el scan fresco" >&2; exit 1; }
          if [ "$OLD_RESULTS" != "$NEW_RESULTS" ]; then
            echo "::error::detect-secrets: drift vs .secrets.baseline (new/changed findings)."
            echo "::error::Never update the baseline blindly — audit locally with 'detect-secrets audit .secrets.baseline' and commit the reviewed result."
            exit 1
          fi
          echo "✅ No secrets detected"

      # ====================================================================
      # 9. SECURITY: COSIGN KEYLESS SIGNING
      # ====================================================================
      # Firma la imagen con Cosign via Sigstore OIDC (sin keys almacenadas)
      # Solo en push real
      - name: Install Cosign
        if: inputs.push == true
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20  # v3.5.0

      # Firma por DIGEST inmutable, no por TAG mutable (ADR-29 §8.1).
      # El tag (image-name:version e image-name:latest) puede sobreescribirse
      # con otro contenido, dejando la firma desincronizada del binario que
      # corre. Firmar image-name@sha256:... ata la firma al contenido exacto.
      # Mismo patrón que .github/actions/sign-with-cosign/action.yml:61-67.
      - name: Sign Docker image with Cosign (keyless, by digest)
        if: inputs.push == true
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::No image digest available del build step — no se puede firmar por digest inmutable. Revisar el output 'digest' de docker/build-push-action."
            exit 1
          fi
          REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "Signing by digest: ${REF}"
          cosign sign --yes "${REF}"
          echo "Imagen firmada por digest via Sigstore transparency log"
